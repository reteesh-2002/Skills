name: Validate Skills Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Conformance, Probes & Suite Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest

      - name: Validate Skill Metadata, Contracts & Policy Drift
        run: |
          python3 scripts/validate-skills.py

      - name: Run Environment & Skills Doctor
        run: |
          python3 scripts/skills-doctor.py

      - name: Run Pytest Conformance & Specialist Probes Suite
        run: |
          pytest tests/ -v

      - name: Run Runtime Conformance & Adversarial Shell Suite
        run: |
          bash tests/verify_runtime.sh
