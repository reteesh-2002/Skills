name: Validate Skills Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Conformance & Skill Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Skill Metadata & Links
        run: |
          python3 scripts/validate-skills.py

      - name: Run Conformance & Adversarial Test Suite
        run: |
          bash tests/verify_runtime.sh
